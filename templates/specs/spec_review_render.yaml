# =====================================================================================
# SPEC SHEET TEMPLATE - review render (client / internal review, not the final delivery)
# =====================================================================================
# Review renders are usually lighter (ProRes 422 or LT, sometimes H.264), keep the same
# frame rate, raster and head layout as the master, and the mix may still be temporary.
#
# Use with:  --profile review   (or your copy of templates/profiles/client_review.yaml)
# The review profile is lenient on naming, captions, loudness and fine blanking, and
# runs the picture checks in fast mode.
# =====================================================================================
spec_version: 1

job:
  title: "Example Feature"           # EDIT
  title_code: "EXFEAT"               # EDIT
  episode: "101"                     # EDIT
  version: "v03"                     # EDIT: review version
  client: "Internal"
  naming_pattern: "{title_code}_{episode}_{format}_{fps_tag}_{audio_tag}_{version}.mov"
  # Or a name PATTERN instead (delete naming_pattern then: give only one). A Python regex on
  # the whole file name; the group `version` is what a job file's `input: pick: latest` sorts by:
  # filename_regex: '^EXFEAT_101_v(?P<version>\d{2})\.mov$'

video:
  container: mov
  codec: prores
  codec_profile: "422"               # EDIT: "422", "422 LT", ... or for an H.264 review:
                                     #   container: mp4, codec: h264, codec_profile: "High",
                                     #   pixel_format: yuv420p (and see the note in timing:)
  width: 1920
  height: 1080
  fps: "24000/1001"
  scan: progressive
  pixel_format: yuv422p10le
  color: {primaries: bt709, transfer: bt709, matrix: bt709, range: tv}
  aspect_ratio: "16:9"
  pixel_aspect: 1.0

timing:
  timecode_mode: non-drop
  program_start_timecode: "01:00:00:00"
  program_duration_frames: 2880      # EDIT: frames of this cut (2 min at 23.976)
  # MP4 files cannot carry a timecode track. cmr then derives the timecode of every frame
  # from program_start_timecode and the head below (the report says "(spec)"), but
  # timing.timecode_start FAILs with "no embedded timecode": switch that check off in
  # your profile for MP4 reviews (timing.timecode_start: {enabled: false}).
  head_layout:
    - {type: slate, frames: 1}
    - {type: black, frames: 23}
    - {type: program}
  tail_layout:
    - {type: black, frames: 24}

audio:
  codec: pcm_s24le                   # H.264 reviews: aac (bit depth is then not compared)
  sample_rate: 48000
  bit_depth: 24
  tracks:
    - {index: 0, layout: stereo, content: "Stereo temp mix"}
  loudness:
    standard: "EBU R128"
    program_track: 0

content:
  captions: {required: false, formats: []}
