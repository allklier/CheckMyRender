# Final delivery QC. Rules only; job values come from the spec via ${spec.*}.
# Per check: `enabled` (default true), `severity` (problem severity, default fail),
# everything else = check params.
profile_version: 1
name: final
description: Final delivery - metadata vs spec, decode check.
checks:
  container.format:
    expect: "${spec.video.container}"
  video.codec:
    codec: "${spec.video.codec}"
    profile: "${spec.video.codec_profile}"
  video.resolution:
    width: "${spec.video.width}"
    height: "${spec.video.height}"
    pixel_aspect: "${spec.video.pixel_aspect}"
    aspect_ratio: "${spec.video.aspect_ratio}"
  video.pixel_format:
    expect: "${spec.video.pixel_format}"
  video.fps:
    expect: "${spec.video.fps}"
  video.scan:
    expect: "${spec.video.scan}"
    unknown_severity: warn
  video.field_order:              # optional spec video.field_order: progressive|tt|bb|tb|bt (absent = not checked)
    video: "${spec.video}"
    unknown_severity: warn
  container.op:                   # optional spec video.operational_pattern, MXF only (e.g. OP1a)
    video: "${spec.video}"
  video.color:
    expect: "${spec.video.color}"
    unknown_severity: warn        # ProRes-in-MOV never reports color_range via ffprobe
    # key_severity: {range: info}  # per-key mismatch severity (primaries|transfer|matrix|range)
  audio.format:
    codec: "${spec.audio.codec}"
    sample_rate: "${spec.audio.sample_rate}"
    bit_depth: "${spec.audio.bit_depth}"
  audio.layout:
    tracks: "${spec.audio.tracks}"
  filename:
    job: "${spec.job}"
    tags:
      format: {from: "${spec.video.height}", map: {720: HD, 1080: HD, 2160: UHD}}
      fps_tag: {from: "${spec.video.fps}", map: {"24000/1001": "2398", "24": "24", "25": "25",
                                                 "30000/1001": "2997", "60000/1001": "5994"}}
      audio_tag: {from: "${spec.audio.tracks.0.layout}", map: {mono: MO, stereo: ST, "5.1": "51"}}
  timing.frame_count:
    timing: "${spec.timing}"
    tolerance_frames: 0
  timing.layout:
    timing: "${spec.timing}"
  timing.timecode_start:
    timing: "${spec.timing}"
  captions.presence:
    captions: "${spec.content.captions}"
  video.black_runs:
    max_black_run_frames: 12     # ~0.5 s at 24p; a fade or cut to black below this passes
  video.blanking:                 # 1px edge defects; thresholds default in the check, tune here
    severity: fail
    dark_edge_mode: flag          # dark picture at an edge (class dark_edge): flag | info | hide
    context_analysis: true        # stage 2: temporal context of each hit (Ken Burns, cut/dissolve) may LOWER it
    # context_severity: {animation: info, transition: info, steady: unchanged, unknown: unchanged}
  audio.loudness:                 # BS.1770 relative-gated over the program range (not dialogue-gated)
    loudness: "${spec.audio.loudness}"    # spec: standard + program_track (one stream) or programs
    audio: "${spec.audio}"        # spec audio.programs: one measurement per program (merged streams, LFE not measured)
    undeclared_programs_severity: warn    # several audio streams, no programs: only one measured (info|warn)
    standards:                    # numbers per standard live here, not in the spec
      "EBU R128": {target_lufs: -23, tolerance_lu: 1, true_peak_max_dbtp: -1}
      "ATSC A/85": {target_lufs: -24, tolerance_lu: 2, true_peak_max_dbtp: -2}
    # lra_max_lu: 20              # optional loudness-range limit
  audio.silence:                  # dead zones in the program range: per declared program, else per stream
    audio: "${spec.audio}"        # optional spec audio.programs and audio.allowed_silence (declared intended silence)
    threshold_dbfs: -60           # frame is silent when all channels peak below this
    max_run_frames: 12            # ~0.5 s at 24p
  audio.silent_channel:
    audio: "${spec.audio}"        # optional spec audio.programs (channel roles) and audio.allowed_silence
    threshold_dbfs: -60           # channel peak below this for the whole program
    include_lfe: false            # true: a program's LFE channel is judged too
  audio.clipping:
    audio: "${spec.audio}"        # optional spec audio.programs: names program + channel role
    clip_dbfs: -0.1               # per-frame sample peak at/above this = clipping
    severity: fail
  decode.errors:
    max_lines: 20
# Waiver matching (D17; used with `cmr check --waivers FILE`). Defaults shown.
waivers:
  video_max_bits: 10              # max dHash distance (of 64 bits) on any sampled frame
  audio_max_db: 2.0               # max per-frame peak/RMS difference (dB) on any sampled frame
  margin_frames: 5                # finding may extend this far outside the waived range
